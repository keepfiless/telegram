name: Download Telegram Post

on:
  workflow_dispatch:
    inputs:
      telegram_link:
        description: 'Telegram post link (e.g., https://t.me/channel/123)'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4==4.11.1 html2text==2020.1.16 pyperclip==1.8.2 requests==2.28.2

      - name: Download Telegram scraper
        run: |
          wget -q https://raw.githubusercontent.com/Steelio/Telegram-Post-Scraper/main/main.py

      - name: Run scraper and download media
        run: |
          python main.py -l "${{ github.event.inputs.telegram_link }}"

      - name: Commit and push downloaded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No files downloaded"
          else
            git commit -m "Download from Telegram: ${{ github.event.inputs.telegram_link }}"
            git push
          fi
