name: 📥 Telegram Downloader

on:
  workflow_dispatch:
    inputs:
      telegram_links:
        description: '🔗 Telegram links (comma/space/newline separated)'
        required: true
      password:
        description: '🔐 Archive password (optional)'
        default: ''

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full file
          pip install requests --quiet
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          mkdir -p downloads

      - name: 📥 Download Files
        run: |
          python3 << 'PY'
          import os, json, re, urllib.parse, hashlib, glob, time, sys
          import requests

          MAX_SIZE_MB = 80
          PASSWORD = """${{ inputs.password }}"""
          REPO = "${{ github.repository }}"
          BRANCH = "${{ github.ref_name }}"

          raw = """${{ inputs.telegram_links }}"""
          links = list(dict.fromkeys([l.strip() for l in re.split(r'[,\s\n]+', raw) if l.strip().startswith('http')]))
          print(f"📋 Found {len(links)} link(s)")
          sys.stdout.flush()

          def safe_name(name):
              base, ext = os.path.splitext(name)
              if not ext: ext = '.bin'
              safe = re.sub(r'[^a-zA-Z0-9._-]', '_', base)[:50] or hashlib.md5(name.encode()).hexdigest()[:12]
              return f"{safe}{ext.lower()}"

          def resolve(link):
              headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
              }

              print("  🔍 Trying telegramdownloader.net...")
              sys.stdout.flush()
              try:
                  r = requests.post(
                      'https://telegramdownloader.net/proxy.php',
                      headers={
                          **headers,
                          'Content-Type': 'application/x-www-form-urlencoded',
                          'Origin': 'https://telegramdownloader.net',
                          'Referer': 'https://telegramdownloader.net/'
                      },
                      data={'telegram_link': link},
                      timeout=60
                  )
                  if r.status_code == 200:
                      data = r.json()
                      url = data.get('data', {}).get('data', {}).get('link')
                      name = data.get('data', {}).get('data', {}).get('file_name')
                      size = data.get('data', {}).get('data', {}).get('file_size')
                      if url:
                          print(f"  ✅ Resolved! Size: {size or 'unknown'}")
                          sys.stdout.flush()
                          return url, name, size
              except Exception as e:
                  print(f"  ⚠️ Error: {e}")
                  sys.stdout.flush()

              print("  🔍 Trying tgsave.com...")
              sys.stdout.flush()
              try:
                  r = requests.post(
                      'https://api.tgsave.com/download',
                      headers={
                          **headers,
                          'Content-Type': 'application/json',
                          'Origin': 'https://tgsave.com',
                          'Referer': 'https://tgsave.com/'
                      },
                      json={"url": link},
                      timeout=60
                  )
                  if r.status_code == 200:
                      data = r.json()
                      url = data.get('url') or data.get('link') or data.get('download_url')
                      name = data.get('filename') or data.get('file_name')
                      size = data.get('size') or data.get('file_size')
                      if url:
                          print(f"  ✅ Resolved! Size: {size or 'unknown'}")
                          sys.stdout.flush()
                          return url, name, size
              except Exception as e:
                  print(f"  ⚠️ Error: {e}")
                  sys.stdout.flush()

              print("  🔍 Trying direct CDN...")
              sys.stdout.flush()
              try:
                  r = requests.get(link, headers=headers, timeout=30)
                  if r.status_code == 200:
                      cdn_patterns = [
                          r'https://cdn[0-9]*\.telesco\.pe/file/[^"<>\s]+',
                          r'https://[^"<>\s]*tg[^"<>\s]*\.com/[^"<>\s]+\.(?:mp4|zip|rar|7z|pdf|mp3)[^"<>\s]*',
                      ]
                      for pattern in cdn_patterns:
                          match = re.search(pattern, r.text)
                          if match:
                              url = match.group(0)
                              name = urllib.parse.unquote(url.split('/')[-1].split('?')[0])
                              print(f"  ✅ Found CDN link!")
                              sys.stdout.flush()
                              return url, name, None
              except Exception as e:
                  print(f"  ⚠️ Error: {e}")
                  sys.stdout.flush()

              return None, None, None

          def download_file(url, path):
              """Download file using requests with streaming and progress"""
              headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                  'Accept': '*/*',
                  'Accept-Language': 'en-US,en;q=0.9',
                  'Connection': 'keep-alive'
              }

              try:
                  print(f"    🔄 Downloading with Python requests...")
                  sys.stdout.flush()

                  with requests.get(url, headers=headers, stream=True, timeout=600) as r:
                      r.raise_for_status()
                      
                      total_size = int(r.headers.get('content-length', 0))
                      if total_size:
                          print(f"    📏 File size: {total_size / (1024*1024):.1f} MB")
                          sys.stdout.flush()

                      downloaded = 0
                      last_print = 0
                      
                      with open(path, 'wb') as f:
                          for chunk in r.iter_content(chunk_size=1024*1024):  # 1MB chunks
                              if chunk:
                                  f.write(chunk)
                                  downloaded += len(chunk)
                                  
                                  # Print progress every 10MB
                                  if total_size and downloaded - last_print >= 10*1024*1024:
                                      pct = downloaded * 100 / total_size
                                      print(f"    📊 Progress: {downloaded/(1024*1024):.1f} MB / {total_size/(1024*1024):.1f} MB ({pct:.1f}%)")
                                      sys.stdout.flush()
                                      last_print = downloaded

                  # Verify download
                  if os.path.exists(path):
                      actual_size = os.path.getsize(path)
                      
                      # Check if file is too small
                      if actual_size < 100 * 1024:  # Less than 100KB
                          print(f"    ⚠️ File too small: {actual_size} bytes")
                          sys.stdout.flush()
                          os.remove(path)
                          return False

                      # Check if download is complete
                      if total_size and actual_size < total_size * 0.95:
                          print(f"    ⚠️ Incomplete: {actual_size}/{total_size} bytes ({actual_size*100/total_size:.1f}%)")
                          sys.stdout.flush()
                          os.remove(path)
                          return False

                      # Check file content
                      with open(path, 'rb') as f:
                          header = f.read(1024).lower()
                          if b'<!doctype' in header or b'<html' in header:
                              print(f"    ⚠️ Downloaded HTML error page instead of file")
                              sys.stdout.flush()
                              os.remove(path)
                              return False
                          if b'{"error"' in header or b'"error":' in header:
                              print(f"    ⚠️ Downloaded JSON error response")
                              sys.stdout.flush()
                              os.remove(path)
                              return False

                      print(f"    ✅ Downloaded successfully! ({actual_size/(1024*1024):.1f} MB)")
                      sys.stdout.flush()
                      return True

                  return False

              except requests.exceptions.Timeout:
                  print(f"    ⚠️ Download timeout")
                  sys.stdout.flush()
                  return False
              except requests.exceptions.RequestException as e:
                  print(f"    ⚠️ Download error: {e}")
                  sys.stdout.flush()
                  return False
              except Exception as e:
                  print(f"    ⚠️ Error: {e}")
                  sys.stdout.flush()
                  return False

          results = []
          for idx, link in enumerate(links, 1):
              print(f"\n{'='*50}")
              print(f"📥 [{idx}/{len(links)}] {link[:60]}...")
              print(f"{'='*50}")
              sys.stdout.flush()

              success = False
              name = None
              folder = None
              filepath = None

              # Try up to 3 times with fresh URL each time
              for attempt in range(1, 4):
                  if attempt > 1:
                      print(f"\n  🔄 Retry attempt {attempt}/3...")
                      time.sleep(2)  # Small delay between retries
                      sys.stdout.flush()

                  url, resolved_name, expected_size = resolve(link)
                  if not url:
                      print("  ❌ Failed to resolve link")
                      sys.stdout.flush()
                      continue

                  print(f"  🔗 URL: {url[:80]}...")
                  sys.stdout.flush()

                  if name is None:
                      name = safe_name(resolved_name or url.split('/')[-1].split('?')[0] or f"file_{idx}")
                      folder = os.path.splitext(name)[0]

                      base_folder = folder
                      counter = 1
                      while os.path.exists(f"downloads/{folder}"):
                          folder = f"{base_folder}_{counter}"
                          counter += 1

                      os.makedirs(f"downloads/{folder}", exist_ok=True)
                      filepath = f"downloads/{folder}/{name}"

                      print(f"  📁 Folder: {folder}")
                      print(f"  📄 File: {name}")
                      sys.stdout.flush()

                  # Remove any existing partial file
                  if os.path.exists(filepath):
                      os.remove(filepath)

                  if download_file(url, filepath):
                      size_mb = os.path.getsize(filepath) / (1024*1024)
                      results.append({'name': name, 'folder': folder, 'link': link, 'size': size_mb})
                      print(f"  ✅ Success!")
                      sys.stdout.flush()
                      success = True
                      break

              if not success:
                  print(f"  ❌ Failed after {attempt} attempts")
                  sys.stdout.flush()
                  if folder:
                      try: 
                          os.rmdir(f"downloads/{folder}")
                      except: 
                          pass

          # Package large files
          print(f"\n{'='*50}")
          print(f"📦 Processing {len(results)} file(s)...")
          print(f"{'='*50}")
          sys.stdout.flush()

          import subprocess
          ARCHIVES = {'.zip', '.rar', '.7z', '.gz', '.xz', '.tar', '.tgz', '.bz2'}

          for r in results:
              folder, name = r['folder'], r['name']
              filepath = f"downloads/{folder}/{name}"
              if not os.path.exists(filepath): 
                  continue

              size_mb = os.path.getsize(filepath) / (1024*1024)
              ext = os.path.splitext(name)[1].lower()
              base = os.path.splitext(name)[0]
              parts = []
              is_archive = ext in ARCHIVES

              orig_dir = os.getcwd()
              os.chdir(f"downloads/{folder}")

              try:
                  if is_archive:
                      if size_mb > MAX_SIZE_MB:
                          print(f"  ✂️ Splitting archive {name} ({size_mb:.1f} MB)...")
                          sys.stdout.flush()
                          cmd = ['7z', 'a', '-v' + str(MAX_SIZE_MB) + 'm', '-mx0']
                          if PASSWORD:
                              cmd += ['-p' + PASSWORD, '-mhe=on']
                          cmd += [f'{name}.7z', name]
                          subprocess.run(cmd, capture_output=True, text=True)
                          volume_files = sorted([f for f in os.listdir('.') if f.startswith(f'{name}.7z.')])
                          if volume_files:
                              os.remove(name)
                              parts = volume_files
                              print(f"  ✅ Split into {len(parts)} volumes")
                          elif os.path.exists(f'{name}.7z'):
                              os.remove(name)
                              parts.append(f'{name}.7z')
                          else:
                              parts.append(name)
                      else:
                          print(f"  📦 Keeping {name} as-is ({size_mb:.1f} MB)")
                          parts.append(name)
                  else:
                      if size_mb > MAX_SIZE_MB:
                          print(f"  ✂️ Splitting {name} ({size_mb:.1f} MB)...")
                          sys.stdout.flush()
                          cmd = ['7z', 'a', '-v' + str(MAX_SIZE_MB) + 'm', '-mx1']
                          if PASSWORD:
                              cmd += ['-p' + PASSWORD, '-mhe=on']
                          cmd += [f'{base}.7z', name]
                          subprocess.run(cmd, capture_output=True, text=True)
                          volume_files = sorted([f for f in os.listdir('.') if f.startswith(f'{base}.7z.')])
                          if volume_files:
                              os.remove(name)
                              parts = volume_files
                              print(f"  ✅ Split into {len(parts)} volumes")
                          elif os.path.exists(f'{base}.7z'):
                              os.remove(name)
                              parts.append(f'{base}.7z')
                          else:
                              parts.append(name)
                      elif PASSWORD:
                          print(f"  🔐 Encrypting {name}...")
                          cmd = ['7z', 'a', '-p' + PASSWORD, '-mhe=on', f'{base}.7z', name]
                          subprocess.run(cmd, capture_output=True)
                          if os.path.exists(f'{base}.7z'):
                              os.remove(name)
                              parts.append(f'{base}.7z')
                          else:
                              parts.append(name)
                      else:
                          print(f"  📄 Keeping {name} as-is ({size_mb:.1f} MB)")
                          parts.append(name)
              finally:
                  os.chdir(orig_dir)
              
              r['parts'] = parts
              sys.stdout.flush()

          # Generate READMEs
          print(f"\n📝 Generating READMEs...")
          sys.stdout.flush()
          
          for r in results:
              folder = r['folder']
              raw_base = f"https://github.com/{REPO}/raw/refs/heads/{BRANCH}/downloads/{urllib.parse.quote(folder)}"
              lines = [f"# 📄 {r['name']}", "", f"📦 **Original Size:** {r['size']:.1f} MB", ""]
              is_split = len(r.get('parts', [])) > 1 or any('.7z.' in p for p in r.get('parts', []))

              if is_split:
                  lines.append(f"⚠️ **Split into {len(r['parts'])} volumes due to GitHub limits.**")
                  lines.append("")
                  lines.append("## 📥 Download ALL Volumes")
                  lines.append("")
                  for p in r.get('parts', []):
                      url = f"{raw_base}/{urllib.parse.quote(p)}"
                      part_path = f"downloads/{folder}/{p}"
                      if os.path.exists(part_path):
                          part_size = os.path.getsize(part_path) / (1024*1024)
                          lines.append(f"- [{p}]({url}) ({part_size:.1f} MB)")
                      else:
                          lines.append(f"- [{p}]({url})")
                  first_vol = r['parts'][0] if r['parts'] else f"{r['name']}.7z.001"
                  lines += ["", "## 🔧 Extract", "", f"```bash", f"7z x '{first_vol}'", "```"]
              else:
                  lines.append("## 🔗 Download")
                  lines.append("")
                  for p in r.get('parts', [r['name']]):
                      url = f"{raw_base}/{urllib.parse.quote(p)}"
                      lines.append(f"- 📥 [{p}]({url})")

              lines += ["", "---", f"📎 Source: [Telegram]({r['link']})"]
              with open(f"downloads/{folder}/README.md", 'w') as f:
                  f.write('\n'.join(lines))

          # Main README
          with open('downloads/README.md', 'w') as f:
              f.write("# 📥 Downloads\n\n")
              if results:
                  f.write("| 📄 File | 📦 Size | 📁 Folder |\n")
                  f.write("|---------|---------|----------|\n")
                  for r in results:
                      f.write(f"| {r['name']} | {r['size']:.1f} MB | [{r['folder']}](./{urllib.parse.quote(r['folder'])}) |\n")
              else:
                  f.write("⚠️ No files were downloaded successfully.\n")

          # Cleanup
          for f in glob.glob('downloads/**/*.aria2', recursive=True):
              try: os.remove(f)
              except: pass

          print(f"\n{'='*50}")
          print(f"✅ Completed: {len(results)} file(s) downloaded")
          print(f"{'='*50}")
          sys.stdout.flush()

          # List what's in downloads folder
          print("\n📂 Downloads folder contents:")
          for root, dirs, files in os.walk('downloads'):
              for f in files:
                  fpath = os.path.join(root, f)
                  fsize = os.path.getsize(fpath)
                  print(f"  {fpath} ({fsize} bytes)")
          sys.stdout.flush()
          PY

      - name: 📤 Push Changes
        run: |
          echo "📂 Checking downloads folder..."
          ls -la downloads/ || true
          find downloads -type f -name "*" | head -20
          
          git add downloads/
          git status
          
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi
          
          COUNT=$(git diff --staged --name-only | wc -l)
          echo "📝 Committing $COUNT file(s)..."
          git commit -m "📥 Download: $COUNT file(s)"
          
          echo "📤 Pushing to repository..."
          git push || (git pull --rebase && git push)
          echo "✅ Push completed!"
