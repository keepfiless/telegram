name: 📥 Telegram Downloader

on:
  workflow_dispatch:
    inputs:
      telegram_links:
        description: '🔗 Telegram links (comma/space/newline separated)'
        required: true
      password:
        description: '🔐 Archive password (optional)'
        default: ''

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 p7zip-full file zip wget
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          mkdir -p downloads

      - name: 📥 Download Files
        env:
          TELEGRAM_LINKS: ${{ inputs.telegram_links }}
          PASSWORD: ${{ inputs.password }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python3 download_telegram.py

      - name: 📤 Push Changes
        run: |
          find downloads -name "*.aria2" -delete 2>/dev/null || true

          git add downloads/
          git diff --staged --quiet && echo "ℹ️ No changes" && exit 0

          COUNT=$(git diff --staged --name-only | wc -l)
          git commit -m "📥 Download: $COUNT file(s)"
          git push || (git pull --rebase && git push)
          echo "✅ Pushed!"
