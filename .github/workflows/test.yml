name: 01- 📲 Telegram File Downloader

on:
  workflow_dispatch:
    inputs:
      telegram_links:
        description: '🔗 Telegram links (separate with commas, spaces, or new lines)'
        required: true
        type: string
      password:
        description: '🔐 Password for archive (optional)'
        required: false
        default: ''
        type: string

jobs:
  download-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: ⚙️ Configure Git for large files
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global pack.windowMemory 256m
          git config --global pack.packSizeLimit 100m
          git config --global pack.threads 1
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          echo "✅ Git configured for large file handling"

      - name: 🔧 Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl jq openssl bc p7zip-full python3 aria2

          echo "✅ Dependencies installed"
          echo ""
          echo "Tool versions:"
          curl --version | head -1
          wget --version | head -1
          aria2c --version | head -1
          jq --version
          7z i 2>/dev/null | head -2

      - name: 📋 Parse & Resolve Multiple Links
        id: resolve
        run: |
          python3 << 'PYEOF'
          import os, json, subprocess, sys, re, urllib.parse

          raw_input = """${{ github.event.inputs.telegram_links }}"""

          # Parse links (handle commas, spaces, newlines)
          links = re.split(r'[,\s\n]+', raw_input)
          links = [l.strip() for l in links if l.strip() and l.strip().startswith('http')]

          # Remove duplicates while preserving order
          seen = set()
          unique_links = []
          for link in links:
              if link not in seen:
                  seen.add(link)
                  unique_links.append(link)

          print(f"{'='*60}")
          print(f"📋 Found {len(unique_links)} unique link(s):")
          print(f"{'='*60}")
          for i, link in enumerate(unique_links, 1):
              print(f"  {i}. {link[:80]}...")

          if not unique_links:
              print("❌ No valid links found!")
              sys.exit(1)

          downloads = []
          failed = []

          for idx, telegram_link in enumerate(unique_links, 1):
              print(f"\n{'='*60}")
              print(f"🔍 [{idx}/{len(unique_links)}] Resolving: {telegram_link[:70]}...")
              print(f"{'='*60}")

              raw_url = None
              file_name = None

              # Method 1: telegramdownloader.net API
              try:
                  print("🌐 Method 1: telegramdownloader.net...")
                  encoded_link = urllib.parse.quote(telegram_link)
                  result = subprocess.run([
                      'curl', '-s', '--max-time', '30', '-X', 'POST',
                      '-H', 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                      '-H', 'Content-Type: application/x-www-form-urlencoded',
                      '-d', f'telegram_link={encoded_link}',
                      'https://telegramdownloader.net/proxy.php'
                  ], capture_output=True, text=True, timeout=35)

                  if result.returncode == 0 and result.stdout:
                      data = json.loads(result.stdout)
                      raw_url = data.get('data', {}).get('data', {}).get('link')
                      file_name = data.get('data', {}).get('data', {}).get('file_name')
                      if raw_url:
                          print(f"✅ Method 1 succeeded!")
              except Exception as e:
                  print(f"⚠️ Method 1 failed: {e}")

              # Method 2: tgsave.com API
              if not raw_url:
                  try:
                      print("🌐 Method 2: tgsave.com...")
                      result = subprocess.run([
                          'curl', '-s', '--max-time', '30', '-X', 'POST',
                          '-H', 'User-Agent: Mozilla/5.0',
                          '-H', 'Content-Type: application/json',
                          '-d', json.dumps({"url": telegram_link}),
                          'https://api.tgsave.com/download'
                      ], capture_output=True, text=True, timeout=35)

                      if result.returncode == 0 and result.stdout:
                          data = json.loads(result.stdout)
                          raw_url = data.get('url') or data.get('link') or data.get('download_url')
                          file_name = data.get('filename') or data.get('file_name') or data.get('name')
                          if raw_url:
                              print(f"✅ Method 2 succeeded!")
                  except Exception as e:
                      print(f"⚠️ Method 2 failed: {e}")

              # Method 3: Direct CDN scrape
              if not raw_url:
                  try:
                      print("🌐 Method 3: Direct CDN detection...")
                      result = subprocess.run([
                          'curl', '-sL', '--max-time', '20',
                          '-H', 'User-Agent: TelegramBot (like TwitterBot)',
                          telegram_link
                      ], capture_output=True, text=True, timeout=25)

                      if result.returncode == 0:
                          # Look for CDN links
                          cdn_match = re.search(r'https://cdn[0-9]*\.telesco\.pe/file/[^"]+', result.stdout)
                          if cdn_match:
                              raw_url = cdn_match.group(0)
                          else:
                              media_match = re.search(r'content="([^"]+\.(mp4|mov|avi|mkv|pdf|zip|rar|7z|jpg|jpeg|png|gif|mp3|m4a|wav|flac)[^"]*)"', result.stdout)
                              if media_match:
                                  raw_url = media_match.group(1)

                          if raw_url:
                              file_name = raw_url.split('/')[-1].split('?')[0]
                              print(f"✅ Method 3 succeeded!")
                  except Exception as e:
                      print(f"⚠️ Method 3 failed: {e}")

              if raw_url:
                  # Encode URL path properly
                  if '?' in raw_url:
                      path_part, query = raw_url.split('?', 1)
                      encoded_url = urllib.parse.quote(path_part, safe=':/@.-_~!$&()*+,;=') + '?' + query
                  else:
                      encoded_url = urllib.parse.quote(raw_url, safe=':/@.-_~!$&()*+,;=')

                  # Extract filename if not set
                  if not file_name:
                      file_name = urllib.parse.unquote(raw_url.split('/')[-1].split('?')[0])
                  if not file_name:
                      file_name = f"telegram_file_{idx}"

                  file_name = file_name.split('?')[0].split('#')[0]

                  downloads.append({
                      'telegram_link': telegram_link,
                      'download_url': encoded_url,
                      'file_name': file_name
                  })
                  print(f"📄 Filename: {file_name}")
                  print(f"🔗 URL: {encoded_url[:80]}...")
              else:
                  print(f"❌ Could not resolve download link")
                  failed.append(telegram_link)

          # Save results
          with open('/tmp/downloads_list.json', 'w') as f:
              json.dump(downloads, f)

          with open('/tmp/failed_links.json', 'w') as f:
              json.dump(failed, f)

          print(f"\n{'='*60}")
          print(f"📊 RESOLUTION SUMMARY")
          print(f"{'='*60}")
          print(f"✅ Resolved: {len(downloads)} link(s)")
          print(f"❌ Failed: {len(failed)} link(s)")

          if failed:
              print(f"\n❌ Failed links:")
              for link in failed:
                  print(f"   • {link[:70]}...")

          if not downloads:
              print("\n❌ No links could be resolved!")
              sys.exit(1)

          print(f"\n📥 Ready to download {len(downloads)} file(s)")
          PYEOF

      - name: ⬇️ Download All Files
        id: download
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess, sys, re, hashlib

          def sanitize_name(filename):
              """Sanitize filename for safe filesystem use"""
              base, ext = os.path.splitext(filename)
              if not ext:
                  ext = '.bin'

              # Check for non-ASCII characters
              if not all(ord(c) < 128 for c in base):
                  # Use hash for non-ASCII names
                  safe_base = hashlib.md5(filename.encode('utf-8')).hexdigest()[:12]
              else:
                  safe_base = re.sub(r'[^a-zA-Z0-9._-]', '_', base)
                  safe_base = re.sub(r'_+', '_', safe_base)
                  safe_base = safe_base.strip('_.-')
                  if not safe_base:
                      safe_base = hashlib.md5(filename.encode('utf-8')).hexdigest()[:12]

              return f"{safe_base}{ext.lower()}"

          def download_file(url, output_path):
              """Try multiple download methods"""
              methods = [
                  # Method 1: aria2c
                  lambda: subprocess.run([
                      'aria2c',
                      '--max-connection-per-server=16', '--split=16', '--min-split-size=1M',
                      '--max-tries=10', '--retry-wait=5', '--timeout=600', '--connect-timeout=60',
                      '--allow-overwrite=true', '--auto-file-renaming=false', '--check-certificate=false',
                      '--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                      '--header=Accept: */*', '--header=Accept-Language: en-US,en;q=0.9',
                      '--header=Accept-Encoding: identity', '--header=Referer: https://t.me/',
                      '--header=Connection: keep-alive',
                      '--dir=' + os.path.dirname(output_path),
                      '--out=' + os.path.basename(output_path),
                      url
                  ], capture_output=True, timeout=7200),

                  # Method 2: curl HTTP/1.1
                  lambda: subprocess.run([
                      'curl', '-L', '-C', '-', '--http1.1', '--max-time', '3600',
                      '--connect-timeout', '60', '--retry', '5', '--retry-delay', '5',
                      '-H', 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                      '-H', 'Accept: */*', '-H', 'Accept-Encoding: identity',
                      '-H', 'Referer: https://t.me/', '-H', 'Connection: keep-alive',
                      '-o', output_path, url
                  ], capture_output=True, timeout=7200),

                  # Method 3: wget
                  lambda: subprocess.run([
                      'wget', '--timeout=600', '--tries=10', '--retry-connrefused', '--continue',
                      '--no-check-certificate',
                      '--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                      '--header=Accept: */*', '--header=Accept-Encoding: identity',
                      '--header=Referer: https://t.me/',
                      '-O', output_path, url
                  ], capture_output=True, timeout=7200),
              ]

              method_names = ['aria2c', 'curl', 'wget']

              for i, method in enumerate(methods):
                  try:
                      print(f"    🔄 Attempt {i+1}/3 — {method_names[i]}...")
                      if os.path.exists(output_path):
                          os.remove(output_path)

                      result = method()

                      if os.path.exists(output_path):
                          size = os.path.getsize(output_path)
                          if size > 1024:
                              print(f"    ✅ Success with {method_names[i]}!")
                              return True

                      print(f"    ⚠️ {method_names[i]} failed")
                  except Exception as e:
                      print(f"    ⚠️ {method_names[i]} error: {e}")

              return False

          # Load downloads list
          with open('/tmp/downloads_list.json', 'r') as f:
              downloads = json.load(f)

          if not downloads:
              print("❌ No files to download!")
              sys.exit(1)

          os.makedirs('downloads', exist_ok=True)

          downloaded_files = []
          failed_downloads = []

          for idx, item in enumerate(downloads, 1):
              url = item['download_url']
              original_name = item['file_name']
              telegram_link = item['telegram_link']

              safe_name = sanitize_name(original_name)

              print(f"\n{'='*60}")
              print(f"⬇️ [{idx}/{len(downloads)}] Downloading: {original_name}")
              print(f"📄 Safe name: {safe_name}")
              print(f"🔗 From: {telegram_link[:60]}...")
              print(f"{'='*60}")

              # Handle duplicates
              final_name = safe_name
              counter = 1
              while os.path.exists(os.path.join('downloads', final_name)):
                  base, ext = os.path.splitext(safe_name)
                  final_name = f"{base}_{counter}{ext}"
                  counter += 1

              output_path = os.path.join('downloads', final_name)

              if download_file(url, output_path):
                  size = os.path.getsize(output_path)
                  size_mb = size / (1024 * 1024)
                  print(f"✅ Downloaded: {final_name} ({size_mb:.2f} MB)")

                  downloaded_files.append({
                      'filename': final_name,
                      'original_name': original_name,
                      'telegram_link': telegram_link,
                      'size_bytes': size,
                      'size_mb': round(size_mb, 2)
                  })
              else:
                  print(f"❌ All download methods failed for: {original_name}")
                  failed_downloads.append({
                      'original_name': original_name,
                      'telegram_link': telegram_link
                  })

          # Save results
          with open('/tmp/downloaded_files.json', 'w') as f:
              json.dump(downloaded_files, f)

          with open('/tmp/failed_downloads.json', 'w') as f:
              json.dump(failed_downloads, f)

          print(f"\n{'='*60}")
          print(f"📊 DOWNLOAD SUMMARY")
          print(f"{'='*60}")
          print(f"✅ Downloaded: {len(downloaded_files)} file(s)")
          print(f"❌ Failed: {len(failed_downloads)} file(s)")

          if downloaded_files:
              total_mb = sum(f['size_mb'] for f in downloaded_files)
              print(f"💾 Total size: {total_mb:.2f} MB")

          if not downloaded_files:
              print("\n❌ No files were downloaded successfully!")
              sys.exit(1)
          PYEOF

      - name: 📦 Package Files (Split if needed)
        id: package
        run: |
          python3 << 'PYEOF'
          import os, subprocess, json, glob

          ZIP_PASSWORD = """${{ github.event.inputs.password }}"""

          with open('/tmp/downloaded_files.json', 'r') as f:
              downloaded_files = json.load(f)

          if not downloaded_files:
              print("ℹ️ No files to package")
              exit(0)

          packaged_files = []

          for file_info in downloaded_files:
              filename = file_info['filename']
              filepath = os.path.join('downloads', filename)

              if not os.path.exists(filepath):
                  continue

              size = os.path.getsize(filepath)
              size_mb = size / (1024 * 1024)

              entry = {
                  'original_name': file_info['original_name'],
                  'telegram_link': file_info['telegram_link'],
                  'size_mb': round(size_mb, 2),
                  'parts': []
              }

              # Determine split threshold based on file size
              if size_mb < 45:
                  split_mb = 0
              elif size_mb < 500:
                  split_mb = 45
              elif size_mb < 2048:
                  split_mb = 90
              else:
                  split_mb = 190

              split_bytes = split_mb * 1024 * 1024

              print(f"\n{'='*60}")
              print(f"📦 Processing: {filename} ({size_mb:.2f} MB)")

              # Case A: Large file needs splitting
              if split_mb > 0 and size > split_bytes:
                  print(f"✂️ Splitting into {split_mb}MB parts...")

                  base_name = os.path.splitext(filename)[0]
                  archive_path = os.path.join('downloads', f'{base_name}.7z')

                  cmd = ['7z', 'a', f'-v{split_mb}m', '-mx=0']
                  if ZIP_PASSWORD:
                      cmd.extend([f'-p{ZIP_PASSWORD}', '-mhe=on'])
                  cmd.extend([archive_path, filepath])

                  result = subprocess.run(cmd, capture_output=True, text=True)

                  if result.returncode == 0:
                      os.remove(filepath)
                      parts = sorted(glob.glob(os.path.join('downloads', f'{base_name}.7z.*')))
                      print(f"✅ Created {len(parts)} parts")
                      for part in parts:
                          part_size = os.path.getsize(part) / (1024 * 1024)
                          entry['parts'].append({
                              'name': os.path.basename(part),
                              'size_mb': round(part_size, 2)
                          })
                  else:
                      print(f"⚠️ Split failed, keeping original")
                      entry['parts'].append({'name': filename, 'size_mb': round(size_mb, 2)})

              # Case B: Small file but password requested
              elif ZIP_PASSWORD:
                  print(f"🔐 Creating password-protected archive...")
                  base_name = os.path.splitext(filename)[0]
                  archive_path = os.path.join('downloads', f'{base_name}.7z')

                  cmd = ['7z', 'a', f'-p{ZIP_PASSWORD}', '-mhe=on', '-mx=0', archive_path, filepath]
                  result = subprocess.run(cmd, capture_output=True, text=True)

                  if result.returncode == 0:
                      os.remove(filepath)
                      arc_size = os.path.getsize(archive_path) / (1024 * 1024)
                      entry['parts'].append({'name': f'{base_name}.7z', 'size_mb': round(arc_size, 2)})
                      print(f"✅ Archive created")
                  else:
                      entry['parts'].append({'name': filename, 'size_mb': round(size_mb, 2)})

              # Case C: Small file, no password
              else:
                  print(f"📄 Keeping as-is (under threshold)")
                  entry['parts'].append({'name': filename, 'size_mb': round(size_mb, 2)})

              packaged_files.append(entry)

          with open('/tmp/packaged_files.json', 'w') as f:
              json.dump(packaged_files, f)

          print(f"\n{'='*60}")
          print(f"📂 Final files in downloads/:")
          for f in sorted(os.listdir('downloads')):
              fpath = os.path.join('downloads', f)
              if os.path.isfile(fpath):
                  fsize = os.path.getsize(fpath) / (1024 * 1024)
                  print(f"  • {f} ({fsize:.2f} MB)")
          PYEOF

      - name: 📝 Generate Links.md
        run: |
          python3 << 'PYEOF'
          import json, os
          from datetime import datetime
          from urllib.parse import quote

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['GITHUB_REF_NAME']
          raw_base = f"https://github.com/{repo}/raw/refs/heads/{branch}/downloads"

          with open('/tmp/packaged_files.json', 'r') as f:
              packaged_files = json.load(f)

          # Load failed links if any
          failed_links = []
          try:
              with open('/tmp/failed_links.json', 'r') as f:
                  failed_links = json.load(f)
          except:
              pass

          failed_downloads = []
          try:
              with open('/tmp/failed_downloads.json', 'r') as f:
                  failed_downloads = json.load(f)
          except:
              pass

          today = datetime.now().strftime('%Y-%m-%d')
          time_now = datetime.now().strftime('%H:%M:%S')

          lines = []
          lines.append("# 📥 Telegram Downloads\n")
          lines.append(f"**Generated:** {today} at {time_now}\n")
          lines.append("---\n")

          # Summary
          total_files = len(packaged_files)
          total_size = sum(f['size_mb'] for f in packaged_files)
          lines.append(f"## 📊 Summary\n")
          lines.append(f"| Metric | Value |")
          lines.append(f"|--------|-------|")
          lines.append(f"| **Files Downloaded** | {total_files} |")
          lines.append(f"| **Total Size** | {total_size:.2f} MB |")
          if failed_links or failed_downloads:
              lines.append(f"| **Failed** | {len(failed_links) + len(failed_downloads)} |")
          lines.append("\n---\n")

          # File listings
          lines.append("## 📁 Files\n")

          for idx, file_info in enumerate(packaged_files, 1):
              original_name = file_info['original_name']
              telegram_link = file_info['telegram_link']
              size_mb = file_info['size_mb']
              parts = file_info['parts']

              lines.append(f"### {idx}. {original_name}\n")
              lines.append(f"| Property | Value |")
              lines.append(f"|----------|-------|")
              lines.append(f"| **Source** | [Telegram Link]({telegram_link}) |")
              lines.append(f"| **Size** | {size_mb} MB |")
              lines.append(f"| **Parts** | {len(parts)} |")
              lines.append("")

              if len(parts) > 1:
                  lines.append("**📦 Download Parts:**\n")
                  lines.append("| # | File | Size | Link |")
                  lines.append("|---|------|------|------|")
                  for i, part in enumerate(parts, 1):
                      part_name = part['name']
                      part_size = part['size_mb']
                      encoded = quote(part_name, safe='')
                      url = f"{raw_base}/{encoded}"
                      lines.append(f"| {i} | `{part_name}` | {part_size} MB | [⬇️ Download]({url}) |")
                  lines.append("")
                  lines.append("> 💡 **To extract:** Download all parts, then right-click `.7z.001` → Extract with [7-Zip](https://www.7-zip.org/)\n")
              else:
                  part = parts[0]
                  part_name = part['name']
                  part_size = part['size_mb']
                  encoded = quote(part_name, safe='')
                  url = f"{raw_base}/{encoded}"
                  lines.append(f"**📥 Download:** [**{part_name}**]({url}) ({part_size} MB)\n")

              lines.append("---\n")

          # Failed section
          if failed_links or failed_downloads:
              lines.append("## ❌ Failed Items\n")
              if failed_links:
                  lines.append("**Could not resolve:**")
                  for link in failed_links:
                      lines.append(f"- {link[:80]}...")
                  lines.append("")
              if failed_downloads:
                  lines.append("**Could not download:**")
                  for item in failed_downloads:
                      lines.append(f"- {item['original_name']} ([source]({item['telegram_link']}))")
              lines.append("\n---\n")

          # Footer
          lines.append("\n*Generated by GitHub Actions Telegram Downloader*")

          content = "\n".join(lines)

          with open('Links.md', 'w', encoding='utf-8') as f:
              f.write(content)

          print("✅ Links.md generated successfully!")
          print(f"\n{'='*60}")
          print("📄 Links.md Preview:")
          print(f"{'='*60}")
          print(content[:1500])
          if len(content) > 1500:
              print("\n... (truncated)")
          PYEOF
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: 📤 Commit & Push All Files
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          echo "🔄 Syncing with remote..."
          git fetch origin "$BRANCH"
          git pull --rebase origin "$BRANCH" || git pull origin "$BRANCH" --no-rebase

          echo ""
          echo "📂 Files to commit:"
          find downloads -type f -exec ls -lh {} \; 2>/dev/null || echo "  (no downloads)"
          ls -lh Links.md 2>/dev/null || echo "  (no Links.md)"

          echo ""
          echo "📦 Staging files..."
          git add downloads/ Links.md

          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi

          FILE_COUNT=$(git diff --staged --name-only | wc -l)
          echo "📦 Committing $FILE_COUNT file(s)..."

          git commit -m "📲 Telegram download: $FILE_COUNT file(s) [skip ci]"

          echo "🚀 Pushing to $BRANCH..."
          RETRY=0
          MAX_RETRIES=5

          while [ $RETRY -lt $MAX_RETRIES ]; do
            RETRY=$((RETRY + 1))

            if git push origin "HEAD:$BRANCH"; then
              echo "✅ Push successful!"
              break
            else
              echo "⚠️ Push failed (attempt $RETRY/$MAX_RETRIES)"
              if [ $RETRY -lt $MAX_RETRIES ]; then
                echo "🔄 Pulling and retrying..."
                git pull --rebase origin "$BRANCH" || git pull origin "$BRANCH" --no-rebase
                sleep $((2 + RANDOM % 5))
              fi
            fi
          done

          if [ $RETRY -eq $MAX_RETRIES ]; then
            echo "❌ Push failed after $MAX_RETRIES attempts"
            exit 1
          fi

          echo ""
          echo "🎉 All files uploaded successfully!"

      - name: 📋 Final Report
        if: always()
        run: |
          echo ""
          echo "┌─────────────────────────────────────────────────────────────┐"
          echo "│           📲 Telegram Downloader — Final Report            │"
          echo "├─────────────────────────────────────────────────────────────┤"

          if [ -f "/tmp/downloaded_files.json" ]; then
            DOWNLOAD_COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/downloaded_files.json'))))" 2>/dev/null || echo "?")
            echo "│ ✅ Downloaded : $DOWNLOAD_COUNT file(s)"
          fi

          if [ -f "/tmp/failed_downloads.json" ]; then
            FAILED_COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/failed_downloads.json'))))" 2>/dev/null || echo "0")
            if [ "$FAILED_COUNT" != "0" ]; then
              echo "│ ❌ Failed     : $FAILED_COUNT file(s)"
            fi
          fi

          echo "│ 📁 Location   : ./downloads/"
          echo "│ 📄 Links      : ./Links.md"

          if [ -n "${{ github.event.inputs.password }}" ]; then
            echo "│ 🔐 Archive    : Password-protected"
          fi

          echo "└─────────────────────────────────────────────────────────────┘"

          if [ -d "downloads" ]; then
            echo ""
            echo "📂 Downloaded files:"
            ls -lh downloads/ 2>/dev/null | tail -n +2 || echo "  (empty)"
          fi
