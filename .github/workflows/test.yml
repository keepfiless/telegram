name: 01- 📲 Telegram File Downloader

on:
  workflow_dispatch:
    inputs:
      telegram_links:
        description: '🔗 Telegram links (separate with commas, spaces, or new lines)'
        required: true
        type: string
      password:
        description: '🔐 Password for archive (optional)'
        required: false
        default: ''
        type: string

jobs:
  download-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: ⚙️ Configure Git for large files
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global pack.windowMemory 256m
          git config --global pack.packSizeLimit 100m
          git config --global pack.threads 1
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          echo "✅ Git configured for large file handling"

      - name: 🔧 Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl jq openssl bc zip unzip python3 aria2 p7zip-full file

          echo "✅ Dependencies installed"
          echo ""
          echo "Tool versions:"
          curl --version | head -1
          wget --version | head -1
          aria2c --version | head -1
          jq --version
          zip --version | head -2
          7z --help | head -2

      - name: 📁 Ensure downloads folder exists
        run: |
          mkdir -p downloads
          echo "✅ Downloads folder ready"

      - name: 📋 Parse & Resolve Multiple Links
        id: resolve
        run: |
          python3 << 'PYEOF'
          import os, json, subprocess, sys, re, urllib.parse, time

          raw_input = """${{ github.event.inputs.telegram_links }}"""

          # Parse links (handle commas, spaces, newlines)
          links = re.split(r'[,\s\n]+', raw_input)
          links = [l.strip() for l in links if l.strip() and l.strip().startswith('http')]

          # Remove duplicates while preserving order
          seen = set()
          unique_links = []
          for link in links:
              if link not in seen:
                  seen.add(link)
                  unique_links.append(link)

          print(f"{'='*60}")
          print(f"📋 Found {len(unique_links)} unique link(s):")
          print(f"{'='*60}")
          for i, link in enumerate(unique_links, 1):
              print(f"  {i}. {link[:80]}...")

          if not unique_links:
              print("❌ No valid links found!")
              sys.exit(1)

          downloads = []
          failed = []

          for idx, telegram_link in enumerate(unique_links, 1):
              print(f"\n{'='*60}")
              print(f"🔍 [{idx}/{len(unique_links)}] Resolving: {telegram_link[:70]}...")
              print(f"{'='*60}")

              raw_url = None
              file_name = None
              file_size = None

              # Method 1: telegramdownloader.net API
              try:
                  print("🌐 Method 1: telegramdownloader.net...")
                  encoded_link = urllib.parse.quote(telegram_link)
                  result = subprocess.run([
                      'curl', '-s', '--max-time', '30', '-X', 'POST',
                      '-H', 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                      '-H', 'Content-Type: application/x-www-form-urlencoded',
                      '-H', 'Origin: https://telegramdownloader.net',
                      '-H', 'Referer: https://telegramdownloader.net/',
                      '-d', f'telegram_link={encoded_link}',
                      'https://telegramdownloader.net/proxy.php'
                  ], capture_output=True, text=True, timeout=35)

                  if result.returncode == 0 and result.stdout:
                      try:
                          data = json.loads(result.stdout)
                          raw_url = data.get('data', {}).get('data', {}).get('link')
                          file_name = data.get('data', {}).get('data', {}).get('file_name')
                          file_size = data.get('data', {}).get('data', {}).get('file_size')
                          if raw_url:
                              print(f"✅ Method 1 succeeded!")
                              if file_size:
                                  print(f"   Expected size: {file_size}")
                      except json.JSONDecodeError:
                          print(f"⚠️ Method 1: Invalid JSON response")
              except Exception as e:
                  print(f"⚠️ Method 1 failed: {e}")

              # Method 2: tgsave.com API
              if not raw_url:
                  try:
                      print("🌐 Method 2: tgsave.com...")
                      result = subprocess.run([
                          'curl', '-s', '--max-time', '30', '-X', 'POST',
                          '-H', 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                          '-H', 'Content-Type: application/json',
                          '-H', 'Origin: https://tgsave.com',
                          '-H', 'Referer: https://tgsave.com/',
                          '-d', json.dumps({"url": telegram_link}),
                          'https://api.tgsave.com/download'
                      ], capture_output=True, text=True, timeout=35)

                      if result.returncode == 0 and result.stdout:
                          try:
                              data = json.loads(result.stdout)
                              raw_url = data.get('url') or data.get('link') or data.get('download_url')
                              file_name = data.get('filename') or data.get('file_name') or data.get('name')
                              file_size = data.get('size') or data.get('file_size')
                              if raw_url:
                                  print(f"✅ Method 2 succeeded!")
                          except json.JSONDecodeError:
                              print(f"⚠️ Method 2: Invalid JSON response")
                  except Exception as e:
                      print(f"⚠️ Method 2 failed: {e}")

              # Method 3: Direct CDN scrape
              if not raw_url:
                  try:
                      print("🌐 Method 3: Direct CDN detection...")
                      result = subprocess.run([
                          'curl', '-sL', '--max-time', '20',
                          '-H', 'User-Agent: TelegramBot (like TwitterBot)',
                          telegram_link
                      ], capture_output=True, text=True, timeout=25)

                      if result.returncode == 0:
                          # Look for CDN links
                          cdn_match = re.search(r'https://cdn[0-9]*\.telesco\.pe/file/[^"<>\s]+', result.stdout)
                          if cdn_match:
                              raw_url = cdn_match.group(0)
                          else:
                              # Look for video/file meta tags
                              media_match = re.search(r'content="(https?://[^"]+\.(mp4|mov|avi|mkv|pdf|zip|rar|7z|jpg|jpeg|png|gif|mp3|m4a|wav|flac)[^"]*)"', result.stdout, re.IGNORECASE)
                              if media_match:
                                  raw_url = media_match.group(1)

                          if raw_url:
                              file_name = urllib.parse.unquote(raw_url.split('/')[-1].split('?')[0])
                              print(f"✅ Method 3 succeeded!")
                  except Exception as e:
                      print(f"⚠️ Method 3 failed: {e}")

              if raw_url:
                  # Clean URL
                  raw_url = raw_url.strip()

                  # Extract filename if not set
                  if not file_name:
                      file_name = urllib.parse.unquote(raw_url.split('/')[-1].split('?')[0])
                  if not file_name or len(file_name) < 3:
                      file_name = f"telegram_file_{idx}"

                  file_name = file_name.split('?')[0].split('#')[0]

                  downloads.append({
                      'telegram_link': telegram_link,
                      'download_url': raw_url,
                      'file_name': file_name,
                      'expected_size': file_size
                  })
                  print(f"📄 Filename: {file_name}")
                  print(f"🔗 URL: {raw_url[:100]}...")
              else:
                  print(f"❌ Could not resolve download link")
                  failed.append(telegram_link)

          # Save results
          with open('/tmp/downloads_list.json', 'w') as f:
              json.dump(downloads, f)

          with open('/tmp/failed_links.json', 'w') as f:
              json.dump(failed, f)

          print(f"\n{'='*60}")
          print(f"📊 RESOLUTION SUMMARY")
          print(f"{'='*60}")
          print(f"✅ Resolved: {len(downloads)} link(s)")
          print(f"❌ Failed: {len(failed)} link(s)")

          if failed:
              print(f"\n❌ Failed links:")
              for link in failed:
                  print(f"   • {link[:70]}...")

          if not downloads:
              print("\n❌ No links could be resolved!")
              sys.exit(1)

          print(f"\n📥 Ready to download {len(downloads)} file(s)")
          PYEOF

      - name: ⬇️ Download All Files
        id: download
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess, sys, re, hashlib, glob, time

          def sanitize_name(filename):
              """Sanitize filename for safe filesystem use"""
              base, ext = os.path.splitext(filename)
              if not ext:
                  ext = '.bin'

              # Check for non-ASCII characters
              if not all(ord(c) < 128 for c in base):
                  safe_base = hashlib.md5(filename.encode('utf-8')).hexdigest()[:12]
              else:
                  safe_base = re.sub(r'[^a-zA-Z0-9._-]', '_', base)
                  safe_base = re.sub(r'_+', '_', safe_base)
                  safe_base = safe_base.strip('_.-')
                  if not safe_base:
                      safe_base = hashlib.md5(filename.encode('utf-8')).hexdigest()[:12]

              return f"{safe_base}{ext.lower()}"

          def get_unique_folder_name(base_path, folder_name):
              """Get a unique folder name"""
              folder_path = os.path.join(base_path, folder_name)
              if not os.path.exists(folder_path):
                  return folder_name
              counter = 1
              while True:
                  new_name = f"{folder_name}_copy{counter}"
                  new_path = os.path.join(base_path, new_name)
                  if not os.path.exists(new_path):
                      return new_name
                  counter += 1

          def is_valid_download(filepath, expected_ext):
              """Check if downloaded file is valid (not an HTML error page)"""
              if not os.path.exists(filepath):
                  return False, "File does not exist"

              size = os.path.getsize(filepath)
              if size < 1024:
                  return False, f"File too small ({size} bytes)"

              # Check if it's an HTML error page
              try:
                  with open(filepath, 'rb') as f:
                      header = f.read(1024)
                      header_str = header.decode('utf-8', errors='ignore').lower()

                      # Check for HTML content
                      if '<!doctype html' in header_str or '<html' in header_str:
                          return False, "Downloaded HTML instead of file (error page)"

                      # Check for error messages
                      if 'error' in header_str and 'access denied' in header_str:
                          return False, "Access denied error"

                      if '{"error"' in header_str or '"error":' in header_str:
                          return False, "API error response"
              except:
                  pass

              # Validate file type using magic bytes
              try:
                  result = subprocess.run(['file', '--mime-type', '-b', filepath],
                                        capture_output=True, text=True, timeout=10)
                  mime = result.stdout.strip()

                  # If expecting a zip but got HTML/text
                  if expected_ext in ['.zip', '.rar', '.7z']:
                      if 'text/html' in mime or 'text/plain' in mime:
                          return False, f"Wrong file type: {mime}"

                  # If expecting video but got HTML/text
                  if expected_ext in ['.mp4', '.mkv', '.avi', '.mov']:
                      if 'text/html' in mime or 'text/plain' in mime:
                          return False, f"Wrong file type: {mime}"

              except:
                  pass

              return True, "OK"

          def download_file(url, output_path, expected_ext):
              """Download with multiple methods and validation"""

              # Headers for better compatibility
              headers = [
                  'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                  'Accept: */*',
                  'Accept-Language: en-US,en;q=0.9',
                  'Accept-Encoding: identity',
                  'Connection: keep-alive',
                  'Referer: https://t.me/'
              ]

              methods = [
                  # Method 1: curl with full headers
                  lambda: subprocess.run([
                      'curl', '-L', '-f', '-S', '--http1.1',
                      '--max-time', '7200', '--connect-timeout', '60',
                      '--retry', '3', '--retry-delay', '5',
                      '-H', headers[0], '-H', headers[1], '-H', headers[2],
                      '-H', headers[3], '-H', headers[4], '-H', headers[5],
                      '-o', output_path, url
                  ], capture_output=True, timeout=7200),

                  # Method 2: wget
                  lambda: subprocess.run([
                      'wget', '--timeout=600', '--tries=5', '--retry-connrefused',
                      '--no-check-certificate', '--content-disposition',
                      f'--user-agent={headers[0].split(": ", 1)[1]}',
                      '--header=Accept: */*',
                      '--header=Accept-Encoding: identity',
                      '--header=Referer: https://t.me/',
                      '-O', output_path, url
                  ], capture_output=True, timeout=7200),

                  # Method 3: aria2c single connection
                  lambda: subprocess.run([
                      'aria2c', '-x1', '-s1', '-k1M',
                      '--max-tries=5', '--retry-wait=5',
                      '--timeout=600', '--connect-timeout=60',
                      '--allow-overwrite=true', '--auto-file-renaming=false',
                      '--check-certificate=false',
                      f'--user-agent={headers[0].split(": ", 1)[1]}',
                      '--header=Accept: */*',
                      '--header=Accept-Encoding: identity',
                      '--header=Referer: https://t.me/',
                      f'--dir={os.path.dirname(output_path)}',
                      f'--out={os.path.basename(output_path)}',
                      url
                  ], capture_output=True, timeout=7200),
              ]

              method_names = ['curl', 'wget', 'aria2c']

              for i, method in enumerate(methods):
                  try:
                      print(f"    🔄 Attempt {i+1}/3 — {method_names[i]}...")

                      # Remove existing file
                      if os.path.exists(output_path):
                          os.remove(output_path)

                      # Remove aria2 metadata
                      aria2_file = output_path + '.aria2'
                      if os.path.exists(aria2_file):
                          os.remove(aria2_file)

                      result = method()

                      # Clean up aria2 files
                      if os.path.exists(aria2_file):
                          os.remove(aria2_file)

                      if os.path.exists(output_path):
                          size = os.path.getsize(output_path)
                          size_mb = size / (1024 * 1024)

                          # Validate download
                          is_valid, reason = is_valid_download(output_path, expected_ext)

                          if is_valid:
                              print(f"    ✅ Success with {method_names[i]}! ({size_mb:.2f} MB)")
                              return True
                          else:
                              print(f"    ⚠️ {method_names[i]}: {reason}")
                              os.remove(output_path)
                      else:
                          stderr = result.stderr if hasattr(result, 'stderr') else ''
                          print(f"    ⚠️ {method_names[i]} failed: No file created")
                          if stderr:
                              print(f"        Error: {stderr[:200]}")

                  except subprocess.TimeoutExpired:
                      print(f"    ⚠️ {method_names[i]} timed out")
                  except Exception as e:
                      print(f"    ⚠️ {method_names[i]} error: {e}")

              return False

          # Load downloads list
          with open('/tmp/downloads_list.json', 'r') as f:
              downloads = json.load(f)

          if not downloads:
              print("❌ No files to download!")
              sys.exit(1)

          os.makedirs('downloads', exist_ok=True)

          downloaded_files = []
          failed_downloads = []

          for idx, item in enumerate(downloads, 1):
              url = item['download_url']
              original_name = item['file_name']
              telegram_link = item['telegram_link']
              expected_size = item.get('expected_size')

              safe_name = sanitize_name(original_name)
              expected_ext = os.path.splitext(safe_name)[1].lower()

              folder_base_name = os.path.splitext(safe_name)[0]
              folder_name = get_unique_folder_name('downloads', folder_base_name)
              folder_path = os.path.join('downloads', folder_name)
              os.makedirs(folder_path, exist_ok=True)

              print(f"\n{'='*60}")
              print(f"⬇️ [{idx}/{len(downloads)}] Downloading: {original_name}")
              print(f"📄 Safe name: {safe_name}")
              print(f"📁 Folder: {folder_name}")
              if expected_size:
                  print(f"📊 Expected size: {expected_size}")
              print(f"🔗 URL: {url[:80]}...")
              print(f"{'='*60}")

              output_path = os.path.join(folder_path, safe_name)

              if download_file(url, output_path, expected_ext):
                  # Clean up aria2 files
                  for aria2_file in glob.glob(os.path.join(folder_path, '*.aria2')):
                      os.remove(aria2_file)

                  size = os.path.getsize(output_path)
                  size_mb = size / (1024 * 1024)

                  # Get actual file type
                  try:
                      result = subprocess.run(['file', '--mime-type', '-b', output_path],
                                            capture_output=True, text=True, timeout=10)
                      mime_type = result.stdout.strip()
                  except:
                      mime_type = 'unknown'

                  print(f"✅ Downloaded: {folder_name}/{safe_name}")
                  print(f"   Size: {size_mb:.2f} MB | Type: {mime_type}")

                  downloaded_files.append({
                      'filename': safe_name,
                      'folder_name': folder_name,
                      'original_name': original_name,
                      'telegram_link': telegram_link,
                      'size_bytes': size,
                      'size_mb': round(size_mb, 2),
                      'mime_type': mime_type,
                      'status': 'success'
                  })
              else:
                  print(f"❌ All download methods failed for: {original_name}")
                  # Remove empty folder
                  try:
                      os.rmdir(folder_path)
                  except:
                      pass

                  failed_downloads.append({
                      'original_name': original_name,
                      'folder_name': folder_name,
                      'telegram_link': telegram_link,
                      'status': 'failed'
                  })

          # Cleanup
          for aria2_file in glob.glob('downloads/**/*.aria2', recursive=True):
              os.remove(aria2_file)

          # Save results
          with open('/tmp/downloaded_files.json', 'w') as f:
              json.dump(downloaded_files, f)

          with open('/tmp/failed_downloads.json', 'w') as f:
              json.dump(failed_downloads, f)

          print(f"\n{'='*60}")
          print(f"📊 DOWNLOAD SUMMARY")
          print(f"{'='*60}")
          print(f"✅ Downloaded: {len(downloaded_files)} file(s)")
          print(f"❌ Failed: {len(failed_downloads)} file(s)")

          if downloaded_files:
              total_mb = sum(f['size_mb'] for f in downloaded_files)
              print(f"💾 Total size: {total_mb:.2f} MB")

          if not downloaded_files:
              print("\n❌ No files were downloaded successfully!")
              sys.exit(1)
          PYEOF

      - name: 📦 Package Files (Handle Large Files)
        id: package
        run: |
          python3 << 'PYEOF'
          import os, subprocess, json, glob, shutil

          ZIP_PASSWORD = """${{ github.event.inputs.password }}"""
          MAX_FILE_SIZE_MB = 80

          COMPRESSED_EXTENSIONS = {'.zip', '.rar', '.7z', '.gz', '.bz2', '.xz', '.tar', '.tgz', '.tbz2', '.lzma', '.cab'}

          os.makedirs('downloads', exist_ok=True)

          try:
              with open('/tmp/downloaded_files.json', 'r') as f:
                  downloaded_files = json.load(f)
          except:
              downloaded_files = []

          if not downloaded_files:
              print("ℹ️ No files to package")
              with open('/tmp/packaged_files.json', 'w') as f:
                  json.dump([], f)
              exit(0)

          packaged_files = []

          for file_info in downloaded_files:
              filename = file_info['filename']
              folder_name = file_info['folder_name']
              folder_path = os.path.join('downloads', folder_name)
              filepath = os.path.join(folder_path, filename)

              if not os.path.exists(filepath):
                  print(f"⚠️ File not found: {filepath}")
                  continue

              size = os.path.getsize(filepath)
              size_mb = size / (1024 * 1024)

              entry = {
                  'original_name': file_info['original_name'],
                  'telegram_link': file_info['telegram_link'],
                  'folder_name': folder_name,
                  'size_mb': round(size_mb, 2),
                  'status': 'success',
                  'parts': []
              }

              print(f"\n{'='*60}")
              print(f"📦 Processing: {folder_name}/{filename} ({size_mb:.2f} MB)")

              base_name = os.path.splitext(filename)[0]
              ext = os.path.splitext(filename)[1].lower()
              is_already_compressed = ext in COMPRESSED_EXTENSIONS

              if is_already_compressed:
                  print(f"📦 Already compressed ({ext}) - will NOT re-compress")

              # Case A: Already compressed - just split if needed
              if is_already_compressed:
                  if size_mb > MAX_FILE_SIZE_MB:
                      print(f"✂️ Splitting large archive...")
                      original_dir = os.getcwd()
                      os.chdir(folder_path)

                      cmd = ['split', '-b', f'{MAX_FILE_SIZE_MB}m', '-d', '--additional-suffix=.part', filename, f'{filename}.']
                      result = subprocess.run(cmd, capture_output=True, text=True)

                      if result.returncode == 0:
                          os.remove(filename)
                          parts = sorted(glob.glob(f'{filename}.[0-9]*.part'))
                          for part_file in parts:
                              part_size = os.path.getsize(part_file) / (1024 * 1024)
                              entry['parts'].append({'name': part_file, 'size_mb': round(part_size, 2)})
                              print(f"  ✅ Part: {part_file} ({part_size:.2f} MB)")
                          print(f"✅ Split into {len(entry['parts'])} parts")
                      else:
                          print(f"⚠️ Split failed, keeping original")
                          entry['parts'].append({'name': filename, 'size_mb': round(size_mb, 2)})

                      os.chdir(original_dir)
                  else:
                      print(f"📄 Keeping original (under {MAX_FILE_SIZE_MB}MB)")
                      entry['parts'].append({'name': filename, 'size_mb': round(size_mb, 2)})

              # Case B: Large uncompressed file
              elif size_mb > MAX_FILE_SIZE_MB:
                  print(f"✂️ Creating split 7z archive...")
                  original_dir = os.getcwd()
                  os.chdir(folder_path)

                  archive_name = f'{base_name}.7z'
                  if ZIP_PASSWORD:
                      cmd = ['7z', 'a', '-v80m', f'-p{ZIP_PASSWORD}', '-mhe=on', archive_name, filename]
                  else:
                      cmd = ['7z', 'a', '-v80m', '-mx=0', archive_name, filename]

                  result = subprocess.run(cmd, capture_output=True, text=True)

                  if result.returncode == 0:
                      os.remove(filename)
                      parts = sorted(glob.glob(f'{base_name}.7z.*'))
                      if not parts:
                          parts = [archive_name] if os.path.exists(archive_name) else []
                      for part_file in parts:
                          part_size = os.path.getsize(part_file) / (1024 * 1024)
                          entry['parts'].append({'name': part_file, 'size_mb': round(part_size, 2)})
                          print(f"  ✅ Part: {part_file} ({part_size:.2f} MB)")
                      print(f"✅ Created {len(entry['parts'])} part 7z archive")
                  else:
                      print(f"⚠️ 7z failed, keeping original")
                      entry['parts'].append({'name': filename, 'size_mb': round(size_mb, 2)})

                  os.chdir(original_dir)

              # Case C: Password requested
              elif ZIP_PASSWORD:
                  print(f"🔐 Creating password-protected 7z...")
                  original_dir = os.getcwd()
                  os.chdir(folder_path)

                  archive_name = f'{base_name}.7z'
                  cmd = ['7z', 'a', f'-p{ZIP_PASSWORD}', '-mhe=on', archive_name, filename]
                  result = subprocess.run(cmd, capture_output=True, text=True)
                  os.chdir(original_dir)

                  archive_path = os.path.join(folder_path, archive_name)
                  if result.returncode == 0 and os.path.exists(archive_path):
                      os.remove(filepath)
                      archive_size = os.path.getsize(archive_path) / (1024 * 1024)
                      entry['parts'].append({'name': archive_name, 'size_mb': round(archive_size, 2)})
                      print(f"✅ Created: {archive_name} ({archive_size:.2f} MB)")
                  else:
                      entry['parts'].append({'name': filename, 'size_mb': round(size_mb, 2)})

              # Case D: Keep as-is
              else:
                  print(f"📄 Keeping original format")
                  entry['parts'].append({'name': filename, 'size_mb': round(size_mb, 2)})

              packaged_files.append(entry)

          # Add failed downloads
          try:
              with open('/tmp/failed_downloads.json', 'r') as f:
                  for failed in json.load(f):
                      packaged_files.append({
                          'original_name': failed['original_name'],
                          'telegram_link': failed['telegram_link'],
                          'folder_name': failed.get('folder_name', 'unknown'),
                          'size_mb': 0,
                          'status': 'failed',
                          'parts': []
                      })
          except:
              pass

          with open('/tmp/packaged_files.json', 'w') as f:
              json.dump(packaged_files, f)

          print(f"\n{'='*60}")
          print(f"📂 Final structure:")
          for folder in sorted(os.listdir('downloads')):
              folder_path = os.path.join('downloads', folder)
              if os.path.isdir(folder_path):
                  print(f"  📁 {folder}/")
                  for f in sorted(os.listdir(folder_path)):
                      fpath = os.path.join(folder_path, f)
                      if os.path.isfile(fpath):
                          fsize = os.path.getsize(fpath) / (1024 * 1024)
                          print(f"      • {f} ({fsize:.2f} MB)")
          PYEOF

      - name: 📝 Generate README files
        run: |
          python3 << 'PYEOF'
          import json, os
          from datetime import datetime
          from urllib.parse import quote

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['GITHUB_REF_NAME']

          os.makedirs('downloads', exist_ok=True)

          try:
              with open('/tmp/packaged_files.json', 'r') as f:
                  packaged_files = json.load(f)
          except:
              packaged_files = []

          today = datetime.now().strftime('%Y-%m-%d')
          time_now = datetime.now().strftime('%H:%M:%S')

          for file_info in packaged_files:
              folder_name = file_info['folder_name']
              folder_path = os.path.join('downloads', folder_name)
              os.makedirs(folder_path, exist_ok=True)

              original_name = file_info['original_name']
              telegram_link = file_info['telegram_link']
              size_mb = file_info['size_mb']
              status = file_info.get('status', 'success')
              parts = file_info.get('parts', [])

              raw_base = f"https://github.com/{repo}/raw/refs/heads/{branch}/downloads/{quote(folder_name, safe='')}"

              lines = []
              lines.append(f"# {original_name}\n")
              lines.append(f"**Downloaded:** {today} at {time_now}\n")
              lines.append("---\n")

              if status == 'success':
                  lines.append("## Status\n")
                  lines.append(f"- **Status:** Downloaded")
                  lines.append(f"- **Size:** {size_mb} MB")
                  lines.append(f"- **Parts:** {len(parts)}")
                  lines.append(f"- **Source:** [Telegram]({telegram_link})\n")

                  if parts:
                      lines.append("## Download\n")
                      has_split = len(parts) > 1

                      if has_split:
                          lines.append("**Download ALL parts:**\n")

                      for i, part in enumerate(parts, 1):
                          part_name = part['name']
                          part_size = part['size_mb']
                          url = f"{raw_base}/{quote(part_name, safe='')}"
                          if has_split:
                              lines.append(f"{i}. [{part_name}]({url}) ({part_size} MB)")
                          else:
                              lines.append(f"[Download {part_name}]({url}) ({part_size} MB)\n")

                      if has_split:
                          lines.append("\n**To reassemble:**")
                          lines.append("```bash")
                          lines.append("# Linux/Mac:")
                          lines.append(f"cat *.part > {original_name}")
                          lines.append("# Windows:")
                          lines.append(f"copy /b *.part {original_name}")
                          lines.append("```")
              else:
                  lines.append("## Status: FAILED\n")
                  lines.append(f"Download failed. Try manually: [Telegram]({telegram_link})")

              readme_path = os.path.join(folder_path, 'README.md')
              with open(readme_path, 'w', encoding='utf-8') as f:
                  f.write("\n".join(lines))

              print(f"✅ README for: {folder_name}")

          # Main README
          successful = [f for f in packaged_files if f.get('status') == 'success']
          failed = [f for f in packaged_files if f.get('status') == 'failed']

          lines = ["# Downloaded Files\n", f"**Updated:** {today}\n", "---\n"]

          if successful:
              lines.append("## Files\n")
              lines.append("| File | Size | Folder |")
              lines.append("|------|------|--------|")
              for f in successful:
                  folder_link = f"./{quote(f['folder_name'], safe='')}"
                  lines.append(f"| {f['original_name']} | {f['size_mb']} MB | [{f['folder_name']}]({folder_link}) |")
              lines.append("")

          if failed:
              lines.append("## Failed\n")
              for f in failed:
                  lines.append(f"- {f['original_name']}")
              lines.append("")

          with open('downloads/README.md', 'w', encoding='utf-8') as f:
              f.write("\n".join(lines))

          print(f"✅ Main README generated")
          PYEOF
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: 📝 Generate Links.md
        run: |
          python3 << 'PYEOF'
          import json, os
          from datetime import datetime
          from urllib.parse import quote

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['GITHUB_REF_NAME']

          try:
              with open('/tmp/packaged_files.json', 'r') as f:
                  packaged_files = json.load(f)
          except:
              packaged_files = []

          successful = [f for f in packaged_files if f.get('status') == 'success']

          today = datetime.now().strftime('%Y-%m-%d')

          lines = ["# Download Links\n", f"**Generated:** {today}\n", "---\n"]

          for idx, file_info in enumerate(successful, 1):
              folder_name = file_info['folder_name']
              raw_base = f"https://github.com/{repo}/raw/refs/heads/{branch}/downloads/{quote(folder_name, safe='')}"

              lines.append(f"## {idx}. {file_info['original_name']}\n")
              lines.append(f"Size: {file_info['size_mb']} MB\n")

              for part in file_info.get('parts', []):
                  url = f"{raw_base}/{quote(part['name'], safe='')}"
                  lines.append(f"- [{part['name']}]({url}) ({part['size_mb']} MB)")

              lines.append("")

          with open('Links.md', 'w', encoding='utf-8') as f:
              f.write("\n".join(lines))

          print("✅ Links.md generated")
          PYEOF
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: 📤 Commit & Push
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          git fetch origin "$BRANCH"
          git pull --rebase origin "$BRANCH" || git pull origin "$BRANCH" --no-rebase

          echo "📂 Files:"
          find downloads -type f -exec ls -lh {} \; 2>/dev/null || echo "  (empty)"

          git add downloads/ Links.md

          if git diff --staged --quiet; then
            echo "ℹ️ No changes"
            exit 0
          fi

          FILE_COUNT=$(git diff --staged --name-only | wc -l)
          git commit -m "📲 Download: $FILE_COUNT file(s) [skip ci]"

          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then
              echo "✅ Push OK"
              exit 0
            fi
            echo "⚠️ Push failed ($i/5)"
            git pull --rebase origin "$BRANCH" || git pull origin "$BRANCH" --no-rebase
            sleep 2
          done

          echo "❌ Push failed"
          exit 1

      - name: 📋 Report
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "  Telegram Downloader Report"
          echo "════════════════════════════════════════"

          if [ -f "/tmp/downloaded_files.json" ]; then
            python3 -c "
          import json
          data = json.load(open('/tmp/downloaded_files.json'))
          print(f'Downloaded: {len(data)} file(s)')
          for f in data:
              print(f'  - {f[\"original_name\"]} ({f[\"size_mb\"]} MB)')
          "
          fi

          if [ -f "/tmp/failed_downloads.json" ]; then
            python3 -c "
          import json
          data = json.load(open('/tmp/failed_downloads.json'))
          if data:
              print(f'Failed: {len(data)} file(s)')
              for f in data:
                  print(f'  - {f[\"original_name\"]}')
          "
          fi

          echo "════════════════════════════════════════"
